<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resultado del Examen de Ingreso 2027 • EST UTN San Miguel</title>
  <link rel="stylesheet" href="css/styles.css?v=2027.7">

  <!-- Solo Firestore: el portal del estudiante no usa el padrón ni las cargas de los preceptores -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    body { background: var(--bg-primary); color: var(--text-main); min-height: 100vh; }
    .student-wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1rem 3rem; }
    .student-header { text-align: center; margin-bottom: 1.5rem; }
    .student-header h1 { font-size: 1.35rem; margin: 0.5rem 0 0.25rem; }
    .student-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1rem; }
    .dni-form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 380px; margin: 0 auto; }
    .dni-input { font-size: 1.4rem; text-align: center; letter-spacing: 0.1em; }
    .result-top { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
    .result-name { font-size: 1.3rem; font-weight: 700; }
    .result-meta { color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem; }
    .score-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-top: 1.25rem; }
    .score-box { background: var(--bg-elevated); border-radius: var(--radius-md); padding: 0.9rem; text-align: center; }
    .score-box .lbl { color: var(--text-muted); font-size: 0.8rem; }
    .score-box .val { font-size: 1.6rem; font-weight: 800; margin-top: 0.2rem; }
    .condition-banner { margin-top: 1.25rem; padding: 1rem; border-radius: var(--radius-md); text-align: center; font-size: 1.15rem; font-weight: 700; }
    .condition-pasa { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .condition-no-pasa { background: rgba(239, 68, 68, 0.12); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .condition-pendiente { background: rgba(245, 158, 11, 0.12); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .answers-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .answers-table th, .answers-table td { padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--border-subtle); text-align: left; }
    .answers-table th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; }
    .answers-table .c { text-align: center; }
    .ok { color: #34d399; font-weight: 700; }
    .bad { color: #f87171; font-weight: 700; }
    .section-title { font-size: 1rem; font-weight: 700; margin: 0 0 0.75rem; }
    .schedule-card { margin-top: 1rem; padding: 1rem 1.1rem; border-radius: var(--radius-md); background: var(--bg-elevated); border: 1px solid rgba(16, 185, 129, 0.35); }
    .schedule-item { margin-top: 0.75rem; }
    .schedule-title { font-weight: 700; font-size: 1rem; margin-bottom: 0.35rem; }
    .schedule-item ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.3rem; font-size: 0.92rem; }
    .msg-error { color: #f87171; text-align: center; min-height: 1.2em; }
    @media (max-width: 560px) {
      .answers-table .hide-sm { display: none; }
      .student-card { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="student-wrap">
    <div class="student-header">
      <div class="auth-logo-badge" style="margin: 0 auto;">📐</div>
      <h1>EST &bull; UTN San Miguel</h1>
      <div class="auth-subtitle">Examen de Ingreso 2027 &bull; Consulta de resultados</div>
    </div>

    <!-- Ingreso con DNI -->
    <section id="dniLoginCard" class="student-card">
      <form id="dniLoginForm" class="dni-form">
        <label for="dniInput" class="form-label-auth" style="text-align: center;">Ingresá el DNI del estudiante (solo números):</label>
        <input type="text" id="dniInput" class="form-control-auth dni-input" inputmode="numeric" autocomplete="off" placeholder="Ej: 54123456" maxlength="10" required>
        <button type="submit" id="btnDniSubmit" class="btn btn-primary w-100 py-2">Ver mi resultado</button>
        <div id="dniError" class="msg-error"></div>
      </form>
    </section>

    <!-- Resultado -->
    <section id="resultView" style="display: none;">
      <div class="student-card">
        <div class="result-top">
          <div>
            <div class="result-name" id="resName"></div>
            <div class="result-meta" id="resMeta"></div>
          </div>
          <button type="button" class="btn btn-secondary" id="btnLogout">Consultar otro DNI</button>
        </div>
        <div id="resSummary"></div>
      </div>

      <div class="student-card" id="resAnswersCard" style="display: none;">
        <h2 class="section-title">Tus respuestas</h2>
        <div style="overflow-x: auto;">
          <table class="answers-table">
            <thead>
              <tr>
                <th class="c">N°</th>
                <th class="hide-sm">Materia</th>
                <th>Contenido</th>
                <th class="c">Tu respuesta</th>
                <th class="c">Resultado</th>
              </tr>
            </thead>
            <tbody id="resAnswersBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="js/alumno.js?v=2027.9"></script>
</body>
</html>
